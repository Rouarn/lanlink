name: Build installers

# 只在打版本标签（v0.1.1 这种）时自动构建并出安装包；普通提交不会触发流水线。
# workflow_dispatch 只用于临时手动出包（没有标签时，版本取仓库里 tauri.conf.json 的值）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 与本地 packages/core 保持一致；仓库不提交二进制，CI 按平台从官方 release 下载。
  EASYTIER_VERSION: v2.6.4

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            platform_dir: macos-arm64
            easytier_asset: easytier-macos-aarch64-v2.6.4.zip
            bundles: app,dmg
            suffix: macos-arm64.dmg
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform_dir: macos-x64
            easytier_asset: easytier-macos-x86_64-v2.6.4.zip
            bundles: app,dmg
            suffix: macos-x64.dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_dir: windows-x64
            easytier_asset: easytier-windows-x86_64-v2.6.4.zip
            bundles: nsis
            suffix: windows-x64-setup.exe

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager 字段决定，这里不要再写 version，否则会冲突。

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "标签必须形如 v0.1.1，当前是 ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          else
            # 手动触发：沿用仓库里的版本
            VERSION=$(node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$VERSION"

      - name: Sync version into tauri.conf.json
        # 让 app / dmg / 安装包的版本与标签一致。只改 runner 上的工作区，不提交回仓库。
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const p='packages/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')" "${{ steps.version.outputs.version }}"
          node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download EasyTier core (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dest="packages/core/${{ matrix.platform_dir }}"
          mkdir -p "$dest"
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/easytier.zip" \
            "https://github.com/EasyTier/EasyTier/releases/download/${EASYTIER_VERSION}/${{ matrix.easytier_asset }}"
          unzip -q "$RUNNER_TEMP/easytier.zip" -d "$RUNNER_TEMP/easytier"
          find "$RUNNER_TEMP/easytier" -type f -name easytier-core -exec cp {} "$dest/easytier-core" \;
          find "$RUNNER_TEMP/easytier" -type f -name easytier-cli -exec cp {} "$dest/easytier-cli" \;
          chmod +x "$dest/easytier-core" "$dest/easytier-cli"
          "$dest/easytier-core" --version || true
          test -x "$dest/easytier-core"

      - name: Download EasyTier core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "packages/core/${{ matrix.platform_dir }}"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "easytier.zip"
          $url = "https://github.com/EasyTier/EasyTier/releases/download/$env:EASYTIER_VERSION/${{ matrix.easytier_asset }}"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "easytier") -Force
          $root = Join-Path $env:RUNNER_TEMP "easytier"
          # core/cli 之外还要带上 wintun.dll 等运行期依赖，否则创建 TUN 网卡会失败。
          Get-ChildItem -Recurse $root -File |
            Where-Object { $_.Name -notlike "easytier-web*" } |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $dest $_.Name) -Force }
          Get-ChildItem $dest | Format-Table Name, Length
          if (-not (Test-Path "$dest/easytier-core.exe")) { throw "easytier-core.exe 未就位" }

      - name: Build bundle
        # 无签名证书时显式走 Ad Hoc（macOS）；Windows 不签名。
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm -F @lanlink/desktop tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Rename macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="LanLink-${VERSION}-${{ matrix.suffix }}"
          dir="packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          src="$dir/$name"
          if [ ! -f "$src" ]; then
            src=$(find "$dir" -name "*.dmg" -type f | head -n 1)
          fi
          mv "$src" "$name"
          ls -lh "$name"

      - name: Rename Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "LanLink-$env:VERSION-${{ matrix.suffix }}"
          $src = Get-ChildItem "packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Move-Item $src.FullName $name
          Get-Item $name | Format-List Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LanLink-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          path: LanLink-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 14
