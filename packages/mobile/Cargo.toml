[package]
name = "easytier-mobile"
version = "0.1.0"
edition = "2021"
publish = false
description = "LanLink Android 端使用的 EasyTier 动态库（C ABI 薄封装）"

[lib]
# 产物名必须是 libeasytier.so：运行期由 liblanlink_lib.so 用 libloading 按名加载。
name = "easytier"
crate-type = ["cdylib"]

[dependencies]
# 只开移动端需要的特性：TUN、management-rpc（attach_mobile_tun_fd 的前置）、
# ring 加密后端与 DHCP（Android 虚拟网卡需要先拿到地址再建卡）。
easytier = { path = ".src/easytier", default-features = false, features = [
    "tun",
    "management",
    "ring-crypto",
    "dhcp-ipv4",
    "dhcp-ipv6",
    "tcp-hole-punch",
] }
easytier-core = { path = ".src/easytier-core", default-features = false, features = [
    "ring-crypto",
    "management",
    "dhcp-ipv4",
    "dhcp-ipv6",
] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
once_cell = "1"
async-trait = "0.1"
serde_json = "1"
log = "0.4"
uuid = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
panic = "abort"

# 本机 github.com 的 git 协议不可达：把 EasyTier 用 git 引用的依赖换成
# scripts/fetch-easytier.sh 下载到 .deps/ 的本地目录（与 .src/ 一样是构建缓存，不入库）。
[patch."https://github.com/EasyTier/thunk.git"]
thunk-rs = { path = ".deps/thunk/thunk-rs" }

[patch."https://github.com/EasyTier/thunk"]
thunk-rs = { path = ".deps/thunk/thunk-rs" }

[patch."https://github.com/EasyTier/service-manager-rs.git"]
service-manager = { path = ".deps/service-manager" }

[patch."https://github.com/EasyTier/service-manager-rs"]
service-manager = { path = ".deps/service-manager" }

[patch."https://github.com/EasyTier/rust-tun"]
tun-easytier = { path = ".deps/rust-tun" }

[patch."https://github.com/EasyTier/kcp-sys"]
kcp-sys = { path = ".deps/kcp-sys" }

[patch."https://github.com/EasyTier/tokio-websockets"]
tokio-websockets = { path = ".deps/tokio-websockets" }
