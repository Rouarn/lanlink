[package]
name = "lanlink"
version = "0.1.2"
description = "LanLink 内置 EasyTier 核心的一键联机客户端"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lanlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
# 解析服务支持 https：只引 rustls + 根证书，不引整套 HTTP 栈（请求仍用 http.rs 里的最小实现）。
# 用 ring 后端（不用默认的 aws-lc-rs），避免构建期依赖 cmake / nasm，体积也更小。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
# 局域网发现：组播 socket 的 reuse/join/loop 选项，以及本机网卡枚举。
# mac 上要与原版客户端共享 4445，必须能开 SO_REUSEPORT（在 socket2 的 all 特性里）。
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
security-framework-sys = "2.9.0"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 提权：OpenProcessToken/GetTokenInformation 判断管理员，ShellExecuteExW + runas 重开自身
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
